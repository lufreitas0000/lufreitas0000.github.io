additional_mathematical_training_note: >-
  Alongside formal degree training in physics at UFRN, I attended summer and regular
  mathematics courses at IMPA (Instituto de Matemática Pura e Aplicada) and pursued
  advanced coursework and independent study in algebra, topology, analysis, quantum
  field theory, and conformal field theory.

research_footing:
  current_independent_strength: >-
    Concrete one-dimensional quantum spin chains and selected two-dimensional spin systems,
    particularly the Kitaev honeycomb model and extended JKΓ models, where I continue to
    investigate questions originating in my PhD research.
  collaboration_goal: >-
    I especially value collaborations and mentorship that help identify consequential
    problems and connect explicit microscopic spin-system calculations to broader questions
    of universality, phase structure, and mathematical classification.

