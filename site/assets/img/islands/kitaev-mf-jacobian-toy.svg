<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 370" role="img" aria-labelledby="title desc">
<title id="title">Toy Jacobian spectrum with damping alpha one half</title>
<desc id="desc">Eigenvalues -0.25 and 0.7 of a damped 2 by 2 linear fixed-point iteration, inside the unit circle in the complex plane. This is not Kitaev numerical data.</desc>
<rect width="440" height="370" fill="#FAF6EE"/>
<g stroke="#B8AD9D" stroke-width="1"><path d="M20 165H430 M225 10V330"/></g>
<circle cx="225" cy="165" r="105" fill="none" stroke="#00639A" stroke-width="2"/>
<g font-family="Georgia,serif" font-size="13" fill="#2B2B2B">
<text x="408" y="153">Re λ</text><text x="254" y="18">Im λ</text>
<text x="120" y="182" text-anchor="middle">−1</text><text x="225" y="182" text-anchor="middle">0</text><text x="330" y="182" text-anchor="middle">1</text>
<text x="199" y="141" text-anchor="middle">λ₁</text><text x="298" y="141" text-anchor="middle">λ₂</text>
<text x="215" y="354" text-anchor="middle">α = 0.5, eigenvalues −0.25 and 0.70</text>
</g>
<circle cx="198.75" cy="165" r="6" fill="#E41A1C" stroke="#2B2B2B"/>
<circle cx="298.5" cy="165" r="6" fill="#3B8E38" stroke="#2B2B2B"/>
</svg>