name: Verify Kitaev fixed-point toy and evidence patterns

on:
  push:
    branches: ["feat/kitaev-mf-jacobian-claim-ledger-20261114"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install PyYAML Markdown beautifulsoup4
      - run: node --test test/js/*.test.mjs
      - run: make verify
