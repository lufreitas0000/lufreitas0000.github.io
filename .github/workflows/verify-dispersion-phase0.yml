name: Verify unpublished dispersion fixture

on:
  push:
    branches: ["feat/kitaev-mf-dispersion-island"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install PyYAML Markdown beautifulsoup4
      - run: make verify
