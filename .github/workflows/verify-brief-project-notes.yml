name: Verify brief project notes

on:
  push:
    branches: ["content/publish-lean-and-julia-project-notes-20261113"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install PyYAML Markdown beautifulsoup4
      - run: node --check site/assets/js/feed_filter.js
      - run: node --check site/assets/js/site_navigation.js
      - run: make verify
