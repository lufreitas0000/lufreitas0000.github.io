name: Verify unpublished solver grid and local preview

on:
  push:
    branches: ["feat/kitaev-mf-grid-contract-local-preview-20261114"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: python -m pip install PyYAML Markdown beautifulsoup4
      - run: make help
      - run: node --test test/js/*.test.mjs
      - run: make verify
