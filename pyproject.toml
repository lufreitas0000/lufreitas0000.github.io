[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lu-freitas-website"
version = "0.2.0"
description = "Static research website and Hexagonal Markdown engine for Lu Freitas"
readme = "doc/HOW_TO_USE_AND_MAINTAIN.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "Markdown>=3.5",
  "beautifulsoup4>=4.12",
]

[project.scripts]
web-build = "web_engine.app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
